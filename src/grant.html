<!doctype html>
<html><head><meta charset="utf-8"><title>Always show Listen Later</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; }
  h1 { font-size: 20px; }
  code { background: #f3f3f3; padding: 2px 6px; border-radius: 6px; }
  button { margin-top: 16px; margin-right: 8px; padding: 8px 16px; border: 0; border-radius: 8px; background: #111; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #eee; color: #111; }
  .note { color: #666; }
  #msg { margin-top: 12px; font-size: 13px; }
</style></head>
<body>
  <h1>Always show on this site</h1>
  <p>The player will appear by itself when you visit <code id="origin">this site</code>. Chrome will ask you to allow that site. Every other site stays off until you turn Listen Later on.</p>
  <p class="note">You can remove it later in Listen Later options.</p>
  <button id="allow">Allow this site</button>
  <button id="cancel" class="secondary">Cancel</button>
  <div id="msg"></div>
  <script src="grant.js"></script>
</body></html>
