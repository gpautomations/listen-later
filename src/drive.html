<!doctype html>
<html><head><meta charset="utf-8"><title>Connect Google Drive</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; color: #1d1d1f; }
  h1 { font-size: 20px; }
  button { margin-top: 16px; margin-right: 8px; padding: 8px 16px; border: 0; border-radius: 8px; background: #111; color: #fff; font-size: 14px; cursor: pointer; }
  button.secondary { background: #eee; color: #111; }
  .note { color: #666; }
  #msg { margin-top: 12px; font-size: 13px; }
</style></head>
<body>
  <h1>Connect Google Drive</h1>
  <p>Listen Later will create a folder named Listen Later in your Google Drive and put this episode there. It can only see files it created. Nothing is sent to us.</p>
  <p class="note">Google will ask you to sign in and allow that access. You can disconnect it later in your Google Account permissions.</p>
  <button id="connect">Connect Google Drive</button>
  <button id="cancel" class="secondary">Cancel</button>
  <div id="msg"></div>
  <script src="drive.js"></script>
</body></html>
